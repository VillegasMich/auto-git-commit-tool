name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to Docker Hub (only on a release tag, e.g. v1.2.3)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, tests (incl. offline E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Unit tests + tests/e2e.rs offline simulations. The GitHub E2E test skips itself here.
      - run: cargo test --locked

  docker:
    # PRs and pushes: build + smoke test + dry-run push (tags computed, nothing uploaded).
    # Published releases, and manual runs on a v* tag with `publish` (how release.yml publishes,
    # since its GITHUB_TOKEN release fires no event): the same, then amd64/arm64 push to Docker Hub.
    name: Docker image (smoke test, push on release)
    needs: test
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'release' || (inputs.publish == true && startsWith(github.ref, 'refs/tags/v')) }}
      # Docker Hub repository, e.g. "johndoe/auto-git-commit-tool". See docs/deployment.md.
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/auto-git-commit-tool', vars.DOCKERHUB_USERNAME || 'local') }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: env.PUBLISH == 'true'
      - uses: docker/setup-buildx-action@v3
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Releases: 1.2.3, 1.2 and latest (latest is skipped for pre-releases).
          # Otherwise: pr-<n>, branch name and sha-<short>, which are never pushed.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
            type=ref,event=branch
            type=sha
      - name: Build image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: auto-git-commit-tool:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: >
          docker run --rm -e MIN_COMMITS=2 -e MAX_COMMITS=2
          auto-git-commit-tool:ci simulate --days 2
      - name: Dry-run push
        if: env.PUBLISH != 'true'
        run: |
          {
            echo "### Docker push (dry run)"
            echo "Nothing was pushed. Tags this build would get (releases get version tags + latest):"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
      - name: Check Docker Hub settings
        if: env.PUBLISH == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret (docs/deployment.md)"
            exit 1
          fi
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push (linux/amd64, linux/arm64)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e-github:
    name: E2E against GitHub
    needs: test
    # Real commits and emails: only for code on main, releases and manual runs, not for every PR
    # (PRs get the offline E2E, including notifications against fake servers, in the test job).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: e2e-github
    env:
      # A PAT for the account that owns the E2E repository; the default GITHUB_TOKEN cannot
      # create repositories. See docs/testing.md.
      GH_TOKEN: ${{ secrets.E2E_GH_TOKEN }}
      E2E_GITHUB: "1"
      E2E_REPO: ${{ vars.E2E_REPO || 'auto-git-commit-e2e' }}
      # Optional real notifications. Use a healthcheck separate from production's, or CI pings
      # would hide a real outage.
      E2E_SMTP_HOST: ${{ secrets.E2E_SMTP_USERNAME && (vars.E2E_SMTP_HOST || 'smtp.gmail.com') || '' }}
      E2E_SMTP_PORT: ${{ vars.E2E_SMTP_PORT }}
      E2E_SMTP_USERNAME: ${{ secrets.E2E_SMTP_USERNAME }}
      E2E_SMTP_PASSWORD: ${{ secrets.E2E_SMTP_PASSWORD }}
      E2E_NOTIFY_EMAIL_TO: ${{ vars.E2E_NOTIFY_EMAIL_TO }}
      E2E_HEALTHCHECK_URL: ${{ secrets.E2E_HEALTHCHECK_URL }}
    steps:
      - name: Skip without E2E_GH_TOKEN secret
        if: env.GH_TOKEN == ''
        run: echo "::notice::E2E_GH_TOKEN secret not set; skipping GitHub E2E test"
      - uses: actions/checkout@v4
        if: env.GH_TOKEN != ''
      - uses: dtolnay/rust-toolchain@stable
        if: env.GH_TOKEN != ''
      - uses: Swatinem/rust-cache@v2
        if: env.GH_TOKEN != ''
      - name: cargo test --test e2e github
        if: env.GH_TOKEN != ''
        run: cargo test --locked --test e2e github -- --nocapture
