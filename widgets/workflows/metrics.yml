# Metrics (https://github.com/lowlighter/metrics)
#
# Copy to .github/workflows/metrics.yml in your profile repository (USERNAME/USERNAME).
# Commits github-metrics.svg to that repo. The cron runs daily at 13:00 UTC; set it after your
# COMMIT_TIME.
#
# Requires a classic PAT stored as the secret METRICS_TOKEN with `read:user`
# (add `repo` so private repositories are included). Plugin list:
# https://github.com/lowlighter/metrics#-plugins

name: Metrics

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories
          config_timezone: UTC
          plugins_isocalendar: yes
          plugins_isocalendar_duration: full-year
          plugins_habits: yes
          plugins_habits_charts: yes
          plugins_languages: yes
