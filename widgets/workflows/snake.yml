# Contribution snake (https://github.com/Platane/snk)
#
# Copy to .github/workflows/snake.yml in your profile repository (USERNAME/USERNAME).
# Generates github-snake.svg and github-snake-dark.svg and publishes them to the `output` branch.
# The cron runs daily at 13:00 UTC; set it after your COMMIT_TIME.

name: Generate snake

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
